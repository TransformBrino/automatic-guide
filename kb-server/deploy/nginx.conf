# kb-server Nginx 配置
# 适用环境：Windows 或 Linux，需根据实际路径调整 root 和 proxy_pass
# Windows 路径示例：root C:/kb-server/public;
# Linux 路径示例：root /opt/kb-server/public;

server {
    listen 80;
    server_name kb.internal.company.com;  # 内网域名，部署时替换为实际域名或IP

    # 前端静态文件
    location / {
        root C:/Users/wangt/Documents/trae_projects/Transform_Ai/kb-server/public;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;  # AI 调用可能慢，适当延长
    }
}
